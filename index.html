        // не строгое сравнение (==)
        console.log(1 == 1);// true
        console.log(1 == "1");// true
        console.log(1 == "2");// false
        console.log(false == "0");// true
        console.log("a" == "a");// true
        console.log("a" == "ab");// false

        // строгое сравнение
        console.log(1 === 1);// true
        console.log(1 === "1");// false
        console.log("abc" === true);// false
        console.log(1 === true);// false


        // логические операторы
        // || , | (или)
        console.log(true || true);// true
        console.log(1 || true);// 1
        console.log(0 || 1 || true);// 1
        console.log(0 || false || NaN || 1 || "");// 1
        console.log(false || false);
        console.log(null || 1 || "2");// 1
        console.log(undefined || null || NaN || 0);// 0


        // && , & (И)
        console.log(1 && true);// true
        console.log(1 && true && "A" && null && 2);// null
        console.log("abc" && 1 && true && 123);// 123

        // ! (НЕ)
        console.log(!true);// false
        console.log(!0);// true
        console.log(!null);// true


        // !! (НЕ НЕ)

        if (year == 2015){
